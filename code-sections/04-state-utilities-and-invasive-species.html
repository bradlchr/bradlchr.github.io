  <script type="module">

    // ==================== Global Utility Helpers ====================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeXml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function renderRichMarkdownText(str, plantRef = null) {
      if (!str) return '';
      const normalized = typeof ensureClickableSourceLinksInMarkdown === 'function'
        ? ensureClickableSourceLinksInMarkdown(str, plantRef)
        : String(str);
      let s = escapeHtml(normalized);
      // Markdown bold: **text**
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--text-main);font-weight:700;">$1</strong>');
      // Markdown italics: *text*
      s = s.replace(/(^|[^*])\*([^*]+)\*([^*]|$)/g, '$1<em>$2</em>$3');
      // Markdown links: [text](url)
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" style="color:inherit;text-decoration:underline;font-weight:600;">$1</a>');
      // Paragraph spacing
      s = s.replace(/\n\n/g, '<div style="margin-top:8px;"></div>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    function openContractorsModal() {
      const modal = document.getElementById('contractorsModal');
      const list = document.getElementById('contractorsList');
      if (!modal) return;
      if (list && list.children.length === 0) {
        INVASIVE_REMOVAL_PROFESSIONALS.forEach(pro => {
          const item = document.createElement('div');
          item.className = 'contractor-card-item';
          item.style.cssText = 'padding:12px 14px;background:var(--bg-base);border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:6px;transition:box-shadow 0.15s, border-color 0.15s;';
          
          const phones = pro.phone ? pro.phone.split('/').map(p => p.trim()).filter(Boolean) : [];
          const phoneHtml = phones.map(p => {
            const digits = p.replace(/[^0-9]/g, '');
            return `<a href="tel:${digits}" style="color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-sm);background:var(--bg-surface);border:1px solid var(--border-subtle);font-weight:600;font-size:12px;" title="Call ${escapeHtml(pro.name)}">📞 ${escapeHtml(p)}</a>`;
          }).join('');

          const emails = pro.email ? pro.email.split(',').map(e => e.trim()).filter(Boolean) : [];
          const emailHtml = emails.map(e => {
            return `<a href="mailto:${e}" style="color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-sm);background:var(--bg-surface);border:1px solid var(--border-subtle);font-weight:600;font-size:12px;" title="Email ${escapeHtml(pro.name)}">✉️ ${escapeHtml(e)}</a>`;
          }).join('');

          const webHtml = pro.url ? `<a href="${escapeHtml(pro.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--primary);font-weight:700;font-size:12px;text-decoration:underline;display:inline-flex;align-items:center;gap:4px;" title="Visit website">🌐 ${pro.name.includes('Grow Native') ? 'Official Directory' : 'Website'} &rarr;</a>` : '';

          item.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;">
              <strong style="color:var(--text-main);font-size:14px;font-weight:700;">${escapeHtml(pro.name)}</strong>
              ${webHtml}
            </div>
            <div style="font-size:12px;color:var(--text-muted);line-height:1.4;">${escapeHtml(pro.specialty)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:2px;">
              ${phoneHtml}
              ${emailHtml}
            </div>
          `;
          list.appendChild(item);
        });
      }

      // Configure backdrop click once
      if (!modal.dataset.backdropReady) {
        modal.dataset.backdropReady = 'true';
        modal.addEventListener('click', (e) => {
          const rect = modal.getBoundingClientRect();
          const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height
            && rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
          if (!isInDialog) {
            modal.close();
          }
        });
      }

      try {
        if (!modal.open) {
          modal.showModal();
        }
      } catch (e) {
        modal.setAttribute('open', '');
      }

      if (window.lucide) lucide.createIcons();
    }
    window.openContractorsModal = openContractorsModal;

    const SWEET_16_SPECIES = new Set([
      'echinacea purpurea', 'coreopsis lanceolata', 'symphyotrichum oblongifolium', 
      'bouteloua curtipendula', 'asclepias verticillata', 'aquilegia canadensis',
      'sporobolus heterolepis', 'zizia aurea', 'asclepias tuberosa', 'monarda fistulosa',
      'penstemon digitalis', 'baptisia australis', 'glandularia canadensis',
      'schizachyrium scoparium', 'packera obovata', 'geranium maculatum'
    ]);

    function isSweet16(plant) {
      if (!plant) return false;
      if (plant.is_sweet16 === true || plant.is_sweet_16 === true) return true;
      const sci = (plant.scientific_name || '').toLowerCase().trim();
      if (SWEET_16_SPECIES.has(sci)) return true;
      const tags = plant.special_tags || [];
      return tags.some(t => String(t).toLowerCase().includes('sweet 16'));
    }

    function isKcKeystone(plant) {
      if (!plant) return false;
      if (plant.is_kc_keystone === true || plant.isKcKeystone === true) return true;
      const tags = plant.special_tags || [];
      return tags.some(t => String(t).toLowerCase().includes('keystone'));
    }
